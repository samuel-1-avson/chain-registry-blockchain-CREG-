name: Contribution Arena CI

on:
  pull_request:
    paths:
      - "CREG-Contribution-Arena/**"
      - ".github/workflows/contribution-arena-ci.yml"
  push:
    branches: [main]
    paths:
      - "CREG-Contribution-Arena/**"
      - ".github/workflows/contribution-arena-ci.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CREG-Contribution-Arena
    steps:
      - uses: actions/checkout@v4
        with:
          # The Arena is tracked as a git submodule.  Checkout must materialize
          # it before setup-node resolves the lockfile used for npm caching.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CREG-Contribution-Arena/package-lock.json
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run check:firebase-app-check
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm run test:rules
      - run: npm run test:functions
      - run: npm --prefix functions run typecheck
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:route-bundles
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run smoke:preview
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > dist/arena-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: contribution-arena-dist-${{ github.sha }}
          path: CREG-Contribution-Arena/dist
          if-no-files-found: error
      - name: Attest the production bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: CREG-Contribution-Arena/dist/arena-sbom.json
