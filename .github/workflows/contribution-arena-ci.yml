name: Contribution Arena CI

on:
  pull_request:
    paths:
      - "CREG-Contribution-Arena/**"
      - ".github/workflows/contribution-arena-ci.yml"
      - "docs/WHITEPAPER.md"
      - "docs/CREG_SYSTEM_WORKFLOW.md"
      - "docs/archive/ARENA_PROTOCOL_CHANGELOG.md"
      - "chain-registry/testnet/chain-spec.sepolia.json"
  push:
    branches: [main]
    paths:
      - "CREG-Contribution-Arena/**"
      - ".github/workflows/contribution-arena-ci.yml"
      - "docs/WHITEPAPER.md"
      - "docs/CREG_SYSTEM_WORKFLOW.md"
      - "docs/archive/ARENA_PROTOCOL_CHANGELOG.md"
      - "chain-registry/testnet/chain-spec.sepolia.json"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CREG-Contribution-Arena
    steps:
      - uses: actions/checkout@v7
        with:
          # The Arena is tracked as a git submodule.  Checkout must materialize
          # it before setup-node resolves the lockfile used for npm caching.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CREG-Contribution-Arena/package-lock.json
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm audit --audit-level=high
      - run: npm run check:spec-constants
      - run: npm run lint
      - run: npm run check:firebase-app-check
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm run test:rules
      - run: npm run test:functions
      - run: npm --prefix functions run typecheck
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:route-bundles
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
      - run: npm run smoke:preview
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > dist/arena-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: contribution-arena-dist-${{ github.sha }}
          path: CREG-Contribution-Arena/dist
          if-no-files-found: error
      - name: Attest the production bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: CREG-Contribution-Arena/dist/arena-sbom.json

  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CREG-Contribution-Arena/package-lock.json
      - run: npm ci
        working-directory: CREG-Contribution-Arena
      - run: npm run check:spec-constants
        working-directory: CREG-Contribution-Arena
      - run: node scripts/sync-whitepaper.mjs && node functions/scripts/sync-knowledge.mjs
        working-directory: CREG-Contribution-Arena
      - run: npm run verify:docs
        working-directory: CREG-Contribution-Arena
      - run: git diff --exit-code -- CREG-Contribution-Arena/public/whitepaper CREG-Contribution-Arena/functions/knowledge CREG-Contribution-Arena/src/lib/sepoliaSpec.generated.ts
      - run: npx playwright install --with-deps chromium
        working-directory: CREG-Contribution-Arena
      - run: npm run generate:document-pdfs
        working-directory: CREG-Contribution-Arena
