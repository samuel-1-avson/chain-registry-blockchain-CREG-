name: Rust CI

# The Cargo workspace lives in the `chain-registry/` subdirectory, so every
# `run` step uses `working-directory: chain-registry` (same pattern as
# consensus-evidence.yml). GitHub Actions only executes workflows under the
# repository-root `.github/workflows/`, which is why this lives here and not in
# the (dormant) chain-registry/.github/workflows/ci.yml.
#
# The toolchain is PINNED so the fmt/clippy gates are deterministic: rustfmt and
# clippy lint sets change between stable releases, and `-D warnings` would
# otherwise flip red whenever the runner's stable bumps. Bump this version
# deliberately (and re-run `cargo fmt`/`clippy` locally on the same version).
#
# Solidity uses its own root-level `contract-ci.yml`. That workflow installs
# immutable dependency commits and a pinned Foundry release before building and
# running the contract unit/fuzz suites from a fresh checkout.

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/rust-ci.yml"
      - "chain-registry/crates/**"
      - "chain-registry/Cargo.toml"
      - "chain-registry/Cargo.lock"
      - "chain-registry/contracts/Registry.sol"
      - "chain-registry/scripts/check-security-freeze.sh"
      - "chain-registry/testnet/chain-spec*.json"
      - "chain-registry/testnet/spec-server/chain-spec*.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rust-ci.yml"
      - "chain-registry/crates/**"
      - "chain-registry/Cargo.toml"
      - "chain-registry/Cargo.lock"
      - "chain-registry/contracts/Registry.sol"
      - "chain-registry/scripts/check-security-freeze.sh"
      - "chain-registry/testnet/chain-spec*.json"
      - "chain-registry/testnet/spec-server/chain-spec*.json"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2

defaults:
  run:
    working-directory: chain-registry

jobs:
  security-freeze:
    name: Security-freeze regression guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify retired qualification paths remain disabled
        run: bash scripts/check-security-freeze.sh

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: clippy, rustfmt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev build-essential clang llvm libclang-dev \
            cmake libopenblas-dev protobuf-compiler libprotobuf-dev

      - name: Cache Cargo
        id: cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            chain-registry/target
          key: ${{ runner.os }}-cargo-1.93.0-${{ hashFiles('chain-registry/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-1.93.0-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked
        env:
          # Unreachable on purpose -> tests use their offline fallback path.
          CREG_NODE_URL: "http://127.0.0.1:19999"

      - name: Retain dependency cache after failed diagnostics
        if: failure() && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            chain-registry/target
          key: ${{ runner.os }}-cargo-1.93.0-${{ hashFiles('chain-registry/Cargo.lock') }}

  phase-c-recovery:
    name: Phase C production build and durable recovery
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: clippy

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev build-essential clang llvm libclang-dev \
            cmake libopenblas-dev protobuf-compiler libprotobuf-dev

      - name: Cache production recovery dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            chain-registry/target
          key: ${{ runner.os }}-phase-c-recovery-1.93.0-${{ hashFiles('chain-registry/Cargo.lock') }}

      - name: Compile real fleet node binaries
        run: cargo check --locked --package chain-registry-node --bins --features phase-c-real-fleet

      - name: Verify durable PBFT signing recovery
        run: cargo test --locked --package chain-registry-node --features phase-c-real-fleet --lib pbft_safety::tests

      # The fleet runs the `phase-c-real-fleet` build, which switches the
      # consensus encoding. The default `rust` job tests the other encoding, so
      # without these steps the code that production runs was only compiled.
      - name: Lint the production feature set (deny warnings)
        run: cargo clippy --locked --package chain-registry-node --all-targets --features phase-c-real-fleet -- -D warnings

      # Single-threaded: several node tests mutate process-global environment
      # variables (for example CREG_PUBLIC_VALIDATOR) and race when parallel.
      # Four tests assume the legacy build (fewer than four validators) and are
      # marked `ignore` under this feature with the reason; see AUD-03.
      - name: Test the production feature set (node, all targets)
        run: cargo test --locked --package chain-registry-node --features phase-c-real-fleet -- --test-threads=1
        env:
          # Unreachable on purpose -> tests use their offline fallback path.
          CREG_NODE_URL: "http://127.0.0.1:19999"

      - name: Consensus golden vectors under the Phase C encoding
        run: cargo test --locked --package common --features phase-c-canonical-transactions --test consensus_golden_vectors

      - name: Verify relayer validation
        run: cargo test --locked --package chain-registry-relayer --bin creg-relayer

  dependency-audit:
    name: Dependency advisories and sources (cargo-deny)
    runs-on: ubuntu-latest
    # Advisory for now: the workspace pins old crates (wasmtime 18, sled) that
    # are likely to carry findings. Triage them, then remove this line so the
    # job becomes a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check advisories, bans and sources
        run: cargo deny --workspace check advisories bans sources

  consensus-finalization-smoke:
    name: Testnet consensus smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    defaults:
      run:
        working-directory: chain-registry

    steps:
      - uses: actions/checkout@v4

      - name: Run consensus finalization smoke
        shell: pwsh
        run: ./testnet/consensus-finalization-smoke.ps1
        env:
          CREG_SMOKE_BASE_DOMAIN: testnet.cregnet.dev
          CREG_SMOKE_MIN_TIP: "0"
