events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    upstream observer_backend {
        # Round-robin between observers with automatic failure detection
        server observer-1:8080 max_fails=1 fail_timeout=10s;
        server observer-2:8080 max_fails=1 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Health endpoint for the load balancer itself
        location /lb-status {
            return 200 '{"status":"ok","component":"observer-load-balancer"}';
            add_header Content-Type application/json;
        }

        # Real-time SSE / event stream endpoint
        location ~ ^/(v1/)?events {
            proxy_pass http://observer_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Proxy-Upstream $upstream_addr always;

            # Disable buffering for Server-Sent Events (SSE)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 1s;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }

        # Proxy all blockchain queries to the active observer pool
        location / {
            proxy_pass http://observer_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Proxy-Upstream $upstream_addr always;

            # Failover: if one observer errors, times out, or returns 502/503/504,
            # immediately retry on the next observer in the pool
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;

            # Timeouts
            proxy_connect_timeout 1s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;
        }
    }
}
