# docker-compose.testnet.yml
# Sepolia L1 bootstrap host: shared IPFS, spec-server, postgres, node-1, faucet, relayer, explorer.
#
# Contracts are deployed on Sepolia (see testnet/chain-spec.sepolia.json). This file does not run Anvil
# or deploy L1 contracts.
#
# Usage:
#   pwsh -File testnet.ps1
#   docker compose --env-file .env.testnet -f docker-compose.testnet.yml up -d --build

name: creg-testnet

# Run shared services here; additional validators use docker-compose.validator.yml per host.

x-app-image: &app-image
  image: chain-registry-app:latest
  build:
    context: .
    dockerfile: ${CREG_DOCKERFILE:-Dockerfile}

x-web-explorer-image: &web-explorer-image
  image: chain-registry-web-explorer:latest
  build:
    context: ./explorer
    dockerfile: Dockerfile
    args:
      VITE_CREG_TOKEN: ${TESTNET_TOKEN_ADDR:-0x97c21d46B3eac604e92E907D54aA92eEc0Af550b}
      VITE_STAKING_ADDR: ${TESTNET_STAKING_ADDR:-0xf28C63C4Aafd27025E535Ab9ab7B4daC18C96Bc2}
      VITE_DEV_MODE: ${VITE_DEV_MODE:-true}
      VITE_API_BASE: ""

x-node-base: &node-base
  <<: *app-image
  restart: unless-stopped
  depends_on:
    ipfs:
      condition: service_started
    spec-server:
      condition: service_healthy
  volumes:
    - ./circuits:/app/circuits:ro
    - ./validators:/app/validators:ro
    - ./models:/app/models:ro
    - /var/run/docker.sock:/var/run/docker.sock
    - ./testnet/certs:/app/certs:ro
  environment: &node-env
    CREG_TESTNET: "true"
    CREG_DATA_DIR: "/data"
    CREG_IS_VALIDATOR: "true"
    CREG_ETH_RPC: "${CREG_DOCKER_ETH_RPC:-${SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}}"
    CREG_EXPECTED_L1_CHAIN_ID: "11155111"
    CREG_CHAIN_ID: "${CREG_CHAIN_ID:-creg-testnet-1}"
    CREG_CHAIN_SPEC_URL: http://spec-server/chain-spec.json
    CREG_SPEC_SIGNATURE_URL: http://spec-server/chain-spec.json.sig
    CREG_SPEC_SIGNING_PUBKEY: "${CREG_SPEC_SIGNING_PUBKEY:-0437e4adac481519cd6ae66907294c40cfcbf0bdeadd47806f6233be4bd5f82d}"
    CREG_OPERATOR_API_KEY: "${CREG_OPERATOR_API_KEY:?set a high-entropy server-side operator API key}"
    # Staged validator-authority controls: do not enable mandatory mode before
    # publishing, independently verifying, and rehearsing the exact checkpoint.
    CREG_WEAK_SUBJECTIVITY_CHECKPOINT: "${CREG_WEAK_SUBJECTIVITY_CHECKPOINT:-}"
    CREG_REQUIRE_CERTIFIED_COMMITTEES: "${CREG_REQUIRE_CERTIFIED_COMMITTEES:-false}"
    # CR-07 activation and policy pins are signed-spec-only. These local
    # verifier paths stay empty until reviewed binaries are mounted read-only.
    CREG_NAMESPACE_AUTHORITY_NPM_VERIFIER_PATH: "${CREG_NAMESPACE_AUTHORITY_NPM_VERIFIER_PATH:-}"
    CREG_NAMESPACE_AUTHORITY_PYPI_VERIFIER_PATH: "${CREG_NAMESPACE_AUTHORITY_PYPI_VERIFIER_PATH:-}"
    CREG_NAMESPACE_AUTHORITY_VERIFIER_TIMEOUT_SECS: "${CREG_NAMESPACE_AUTHORITY_VERIFIER_TIMEOUT_SECS:-30}"
    CREG_NAMESPACE_AUTHORITY_MAX_EVIDENCE_BYTES: "${CREG_NAMESPACE_AUTHORITY_MAX_EVIDENCE_BYTES:-2097152}"
    CREG_NAMESPACE_AUTHORITY_MAX_ARTIFACT_BYTES: "${CREG_NAMESPACE_AUTHORITY_MAX_ARTIFACT_BYTES:-16777216}"
    CREG_NAMESPACE_AUTHORITY_MAX_RESULT_BYTES: "${CREG_NAMESPACE_AUTHORITY_MAX_RESULT_BYTES:-65536}"
    CREG_NAMESPACE_AUTHORITY_MAX_CONCURRENT_VERIFICATIONS: "${CREG_NAMESPACE_AUTHORITY_MAX_CONCURRENT_VERIFICATIONS:-2}"
    CREG_IPFS_URL: "${CREG_DOCKER_IPFS_URL:-http://ipfs:5001}"
    CREG_TOKEN_ADDR: "${TESTNET_TOKEN_ADDR:-0x97c21d46B3eac604e92E907D54aA92eEc0Af550b}"
    CREG_STAKING_ADDR: "${TESTNET_STAKING_ADDR:-0xf28C63C4Aafd27025E535Ab9ab7B4daC18C96Bc2}"
    CREG_REGISTRY_ADDR: "${TESTNET_REGISTRY_ADDR:-0x3aCfF05d00AC199412a94326eD8aA874aaA3596c}"
    CREG_GOVERNANCE_ADDR: "${TESTNET_GOVERNANCE_ADDR:-0x9a14F359E2bdBb43F1526743C4A91955F29Ba59A}"
    CREG_ZK_VERIFIER_ADDR: "${TESTNET_ZK_VERIFIER_ADDR:-0x0922AE98AF1D809360BDd5D5AAd84f0D823A5cF3}"
    CREG_VALIDATOR_REWARDS_ADDR: "${TESTNET_VALIDATOR_REWARDS_ADDR:-0x7289d31a689a5647E420Fb358CEb7854dc477847}"
    CREG_BLOCK_INTERVAL: "${CREG_BLOCK_INTERVAL:-5}"
    CREG_SINGLE_VALIDATOR_MODE: "${CREG_SINGLE_VALIDATOR_MODE:-true}"
    CREG_DEV_SANDBOX: "${CREG_DEV_SANDBOX:-false}"
    CREG_ZK_ENABLED: "true"
    CREG_ML_ENABLED: "true"
    CREG_ML_MODEL_PATH: "/app/models"
    CREG_WASM_ENABLED: "true"
    CREG_WASM_VALIDATORS_PATH: "/app/validators"
    CREG_TLS_CERT: "${CREG_TLS_CERT:-}"
    CREG_TLS_KEY: "${CREG_TLS_KEY:-}"
    RUST_LOG: "info,chain_registry_node=debug,consensus=debug"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
    interval: 10s
    timeout: 5s
    retries: 5

services:

  app-image:
    <<: *app-image
    build:
      context: .
      dockerfile: ${CREG_DOCKERFILE:-Dockerfile}
    command: ["true"]
    profiles:
      - build

  web-explorer-image:
    <<: *web-explorer-image
    build:
      context: ./explorer
      dockerfile: Dockerfile
      args:
        VITE_CREG_TOKEN: ${TESTNET_TOKEN_ADDR:-0x97c21d46B3eac604e92E907D54aA92eEc0Af550b}
        VITE_STAKING_ADDR: ${TESTNET_STAKING_ADDR:-0xf28C63C4Aafd27025E535Ab9ab7B4daC18C96Bc2}
        VITE_DEV_MODE: ${VITE_DEV_MODE:-true}
        VITE_API_BASE: ""
    command: ["true"]
    profiles:
      - build

  secure-node-image:
    image: chain-registry-node-secure:latest
    build:
      context: .
      dockerfile: Dockerfile.secure
    depends_on:
      - app-image
    command: ["true"]
    profiles:
      - build

  ipfs:
    image: ipfs/kubo:v0.27.0
    container_name: creg-testnet-ipfs
    ports:
      - "4001:4001"
      - "5001:5001"
      - "8081:8080"
    volumes:
      - ipfs-data:/data/ipfs
      - ./scripts/ipfs-cors-container.sh:/container-init.d/ipfs-cors.sh:ro
    command: ["daemon", "--init", "--init-profile=server", "--routing=dhtclient"]
    environment:
      - IPFS_PROFILE=server
    sysctls:
      - net.core.rmem_max=2500000
      - net.core.wmem_max=2500000
    restart: unless-stopped

  spec-server:
    image: nginx:alpine
    container_name: creg-testnet-spec-server
    volumes:
      - ./testnet/chain-spec.sepolia.json:/usr/share/nginx/html/chain-spec.json:ro
      - ./testnet/chain-spec.sepolia.json.sig:/usr/share/nginx/html/chain-spec.json.sig:ro
      - ./testnet/spec-server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8888:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/chain-spec.json > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: creg-testnet-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-creg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-creg}
      - POSTGRES_DB=${POSTGRES_DB:-chain_registry}
    ports:
      - "5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./testnet/init-testnet-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creg} -d ${POSTGRES_DB:-chain_registry}"]
      interval: 5s
      timeout: 3s
      retries: 5

  node-1:
    <<: *node-base
    image: chain-registry-node-secure:latest
    container_name: creg-testnet-node-1
    privileged: true
    networks:
      default:
        aliases:
          - node
    ports:
      - "8080:8080"
      - "50057:50051"
      - "9000:9000"
    volumes:
      - node-1-data:/data
      - ./circuits:/app/circuits:ro
      - ./validators:/app/validators:ro
      - ./models:/app/models:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./testnet/certs:/app/certs:ro
    depends_on:
      ipfs:
        condition: service_started
      spec-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *node-env
      CREG_NODE_ID: "node-1"
      CREG_VALIDATOR_KEY: "${NODE1_VALIDATOR_KEY}"
      CREG_BRIDGE_KEY: "${CREG_BRIDGE_KEY:?CREG_BRIDGE_KEY must be set in .env.testnet}"
      CREG_VAULT_ADDR: "http://vault:8200"
      CREG_VAULT_TOKEN: "root"
      CREG_LISTEN: "0.0.0.0:8080"
      CREG_P2P_LISTEN: "/ip4/0.0.0.0/tcp/9000"
      CREG_P2P_SEEDS: "${CREG_P2P_SEEDS:-}"
      CREG_VALIDATOR_SET: "${VALIDATOR_SET_JSON}"
      CREG_PG_URL: "${CREG_PG_URL:-postgres://${POSTGRES_USER:-creg}:${POSTGRES_PASSWORD:-creg}@postgres:5432/${POSTGRES_DB:-chain_registry}}"

  cli:
    <<: *app-image
    container_name: creg-testnet-cli
    entrypoint: ["/app/creg"]
    command: ["--help"]
    environment:
      CREG_NODE_URL: "http://node-1:8080"
      CREG_ETH_RPC: "${CREG_DOCKER_ETH_RPC:-${SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}}"
    depends_on:
      - node-1
    profiles:
      - cli

  tui-explorer:
    <<: *app-image
    container_name: creg-testnet-tui-explorer
    entrypoint: ["/app/creg"]
    command: ["explorer"]
    environment:
      CREG_NODE_URL: "http://node-1:8080"
    stdin_open: true
    tty: true
    depends_on:
      node-1:
        condition: service_healthy
    profiles:
      - tui

  faucet:
    <<: *app-image
    container_name: creg-testnet-faucet
    entrypoint: ["/app/faucet"]
    environment:
      FAUCET_PORT: "${FAUCET_PORT:-8082}"
      FAUCET_RPC_URL: "${FAUCET_RPC_URL:-${SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}}"
      FAUCET_PUBLIC_RPC_URL: "${FAUCET_PUBLIC_RPC_URL:-http://localhost:3007/rpc}"
      FAUCET_PRIVATE_KEY: "${FAUCET_PRIVATE_KEY:?FAUCET_PRIVATE_KEY must be set in .env.testnet}"
      FAUCET_ADDRESS: "${FAUCET_ADDRESS:?FAUCET_ADDRESS must be set in .env.testnet}"
      FAUCET_TOKEN_CONTRACT: "${TESTNET_TOKEN_ADDR:-0x97c21d46B3eac604e92E907D54aA92eEc0Af550b}"
      FAUCET_DRIP_AMOUNT: "${FAUCET_DRIP_AMOUNT:-1000000000000000000000}"
      FAUCET_NATIVE_DRIP_AMOUNT: "${FAUCET_NATIVE_DRIP_AMOUNT:-0}"
      FAUCET_COOLDOWN_SECS: "${FAUCET_COOLDOWN_SECS:-60}"
      FAUCET_IP_COOLDOWN_SECS: "${FAUCET_IP_COOLDOWN_SECS:-60}"
      FAUCET_MAX_BALANCE: "${FAUCET_MAX_BALANCE:-10000000000000000000000}"
      FAUCET_NATIVE_MAX_BALANCE: "${FAUCET_NATIVE_MAX_BALANCE:-1000000000000000000}"
      FAUCET_POW_DISABLED: "${FAUCET_POW_DISABLED:-false}"
      FAUCET_EXPLORER_URL: "http://localhost:3007"
      FAUCET_CHAIN_ID: "11155111"
      FAUCET_PG_URL: "${CREG_PG_URL:-postgres://creg:creg@postgres:5432/chain_registry}"
      FAUCET_ADMIN_TOKEN: "${FAUCET_ADMIN_TOKEN:-testnet-admin-secret}"
      RUST_LOG: "info"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      node-1:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  relayer:
    <<: *app-image
    container_name: creg-testnet-relayer
    entrypoint: ["/app/creg-relayer"]
    environment:
      RELAYER_PORT: "${RELAYER_PORT:-8083}"
      RELAYER_RPC_URL: "${RELAYER_RPC_URL:-${SEPOLIA_RPC_URL:-https://ethereum-sepolia-rpc.publicnode.com}}"
      RELAYER_PRIVATE_KEY: "${RELAYER_PRIVATE_KEY:?RELAYER_PRIVATE_KEY must be set in .env.testnet}"
      RELAYER_POLICY_PATH: "/app/config/relayer-policy.example.json"
      TESTNET_TOKEN_ADDR: "${TESTNET_TOKEN_ADDR:-0x97c21d46B3eac604e92E907D54aA92eEc0Af550b}"
      TESTNET_STAKING_ADDR: "${TESTNET_STAKING_ADDR:-0xf28C63C4Aafd27025E535Ab9ab7B4daC18C96Bc2}"
      RUST_LOG: "info"
    ports:
      - "8083:8083"
    depends_on:
      spec-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-explorer:
    <<: *web-explorer-image
    container_name: creg-testnet-web-explorer
    ports:
      - "3007:80"
    depends_on:
      node-1:
        condition: service_healthy
      relayer:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5

  stress-test:
    image: chain-registry-stress-test:latest
    build:
      context: .
      dockerfile: Dockerfile.stress-test
    container_name: creg-stress-test
    working_dir: /app
    volumes:
      - ./scripts/stress-test.py:/app/stress-test.py:ro
      - ./.env.testnet:/app/.env.testnet:ro
    environment:
      DOCKER_MODE: "true"
      CREG_IPFS_URL: "http://ipfs:5001"
    env_file:
      - .env.testnet
    command:
      - --nodes
      - "1"
      - --packages
      - "50"
      - --concurrency
      - "5"
      - --timeout
      - "120"
    depends_on:
      node-1:
        condition: service_healthy
      ipfs:
        condition: service_started
    profiles:
      - stress-test

  vault:
    image: hashicorp/vault:1.15
    container_name: creg-testnet-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    restart: unless-stopped
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-init:
    image: hashicorp/vault:1.15
    container_name: creg-testnet-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
    command: >
      sh -c '
      vault kv put secret/creg/validator
      validator_key="${NODE1_VALIDATOR_KEY}"
      bridge_key="${CREG_BRIDGE_KEY}" &&
      echo "Vault initialized successfully."
      '
    profiles:
      - default

volumes:
  ipfs-data:
  postgres-data:
  node-1-data:

secrets:
  node1-validator-key:
    file: ./validator-keys/validator-1.env
