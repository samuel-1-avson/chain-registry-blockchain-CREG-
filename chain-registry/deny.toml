# cargo-deny policy for the CREG workspace.
#
# CI runs `cargo deny --workspace check advisories bans sources` from this
# directory (see the `dependency-audit` job in .github/workflows/rust-ci.yml).
# `dependency-audit` is a mandatory CI gate (fail-closed on untriaged advisories).
# Licenses are not checked yet: add a [licenses] allow-list before adding
# `licenses` to the CI command.

[graph]
# Audit what ships in the default feature set.
all-features = false

[advisories]
version = 2
# Yanked releases are reported but do not fail the check.
yanked = "warn"
# Record a RUSTSEC id here, with a reason and a review date, when a finding is
# reviewed and accepted. Leave empty otherwise.
ignore = [
    # --- Blocked by libp2p 0.57 / libp2p-swarm 0.48 wasm-bindgen conflict with yara-x 1.24.0 ---
    { id = "RUSTSEC-2026-0534", reason = "Audited 2026-11-22: libp2p-gossipsub 0.49.5 (libp2p 0.56.0); libp2p 0.57 pins wasm-bindgen=0.2.108 conflicting with yara-x 1.24.0 (^0.2.130). Mitigated by subscribed-topic filtering and peer scoring." },

    # --- Blocked by libp2p-dns 0.44.0 (hickory-proto / hickory-resolver max 0.25.x) ---
    { id = "RUSTSEC-2026-0118", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0 -> hickory-resolver 0.25.2; validator P2P dials static multiaddrs / TCP peers." },
    { id = "RUSTSEC-2026-0119", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; no DNS server or zone-file encoder exposed." },
    { id = "RUSTSEC-2026-0487", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; text SVCB/HTTPS record parser not used." },
    { id = "RUSTSEC-2026-0489", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; text SVCB/HTTPS record parser not used." },
    { id = "RUSTSEC-2026-0490", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; zone file lexer not used." },
    { id = "RUSTSEC-2026-0491", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; maximum compatible 0.25 release locked." },
    { id = "RUSTSEC-2026-0504", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; DNSSEC NSEC3 validation disabled." },
    { id = "RUSTSEC-2026-0505", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; DNSSEC NSEC3 validation disabled." },
    { id = "RUSTSEC-2026-0511", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; DNSSEC validation disabled." },
    { id = "RUSTSEC-2026-0512", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; DNSSEC validation disabled." },
    { id = "RUSTSEC-2026-0530", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; DNSSEC validation disabled." },
    { id = "RUSTSEC-2026-0531", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; DNSSEC validation disabled." },
    { id = "RUSTSEC-2026-0532", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; DNSSEC validation disabled." },
    { id = "RUSTSEC-2026-0549", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; DNSSEC validation disabled." },
    { id = "RUSTSEC-2026-0550", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; DNSSEC validation disabled." },
    { id = "RUSTSEC-2026-0551", reason = "Audited 2026-11-22: hickory-proto 0.25.2 pinned by libp2p-dns 0.44.0; DNSSEC validation disabled." },
    { id = "RUSTSEC-2026-0514", reason = "Audited 2026-11-22: hickory-resolver 0.25.2 pinned by libp2p-dns 0.44.0; DNSSEC validation disabled." },

    # --- Upstream cryptography pins (elliptic-curve 0.13.8 & pgp 0.14.2) ---
    { id = "RUSTSEC-2023-0071", reason = "Audited 2026-11-22: rsa 0.9.10 pinned by pgp 0.14.2; no upstream rsa >=0.10 compatible release exists yet (public-key signature verification only in validator/src/pgp.rs)." },
    { id = "RUSTSEC-2026-0387", reason = "Audited 2026-11-22: crypto-bigint 0.5.5 pinned by elliptic-curve 0.13.8 (alloy 0.6.4, k256 0.13.4, p256 0.13.2, pgp 0.14.2, threshold-encryption)." },

    # --- Build-script-only dependency in utoipa-swagger-ui 7.1.0 ---
    { id = "RUSTSEC-2025-0168", reason = "Audited 2026-11-22: zip 1.3.1 is build-dependency only of utoipa-swagger-ui 7.1.0; runtime uses zip 9.1.2 and bounded creg-unpack." },
    { id = "RUSTSEC-2026-0367", reason = "Audited 2026-11-22: zip 1.3.1 is build-dependency only of utoipa-swagger-ui 7.1.0; runtime uses zip 9.1.2." },
    { id = "RUSTSEC-2026-0368", reason = "Audited 2026-11-22: zip 1.3.1 is build-dependency only of utoipa-swagger-ui 7.1.0; runtime uses zip 9.1.2." },
    { id = "RUSTSEC-2026-0369", reason = "Audited 2026-11-22: zip 1.3.1 is build-dependency only of utoipa-swagger-ui 7.1.0; runtime uses zip 9.1.2." },
    { id = "RUSTSEC-2026-0429", reason = "Audited 2026-11-22: zip 1.3.1 is build-dependency only of utoipa-swagger-ui 7.1.0; runtime uses zip 9.1.2." },
    { id = "RUSTSEC-2026-0545", reason = "Audited 2026-11-22: zip 1.3.1 is build-dependency only of utoipa-swagger-ui 7.1.0; runtime uses zip 9.1.2." },
    { id = "RUSTSEC-2026-0548", reason = "Audited 2026-11-22: zip 1.3.1 is build-dependency only of utoipa-swagger-ui 7.1.0; runtime uses zip 9.1.2." },

    # ADR-019 Increment 6 removed the ethers 2.0.14 stack (crates/cross-chain
    # retired) and unlinked zk-validator: 13 ignores dropped (h2 0.3, ring 0.16
    # x2, rustls 0.21 x2, rustls-webpki 0.101 x4, webpki-roots 0.25,
    # rustls-pemfile 1.0, tracing-subscriber 0.2, derivative).

    # --- Transitive unmaintained crates without non-breaking replacement ---
    { id = "RUSTSEC-2025-0141", reason = "Audited 2026-11-22: bincode 2.0.1 unmaintained pulled by yara-x 1.24.0." },
    { id = "RUSTSEC-2026-0543", reason = "Audited 2026-11-22: chrono 0.4.44 unmaintained used across sqlx 0.8.6, pgp 0.14.2, and workspace crates." },
    { id = "RUSTSEC-2026-0105", reason = "Audited 2026-11-22: core2 0.4.0 unmaintained pulled by multihash 0.19.3 in libp2p 0.56.0." },
    { id = "RUSTSEC-2025-0057", reason = "Audited 2026-11-23: fxhash 0.2.1 unmaintained pulled only by sled 0.34.7 in crates/resolver; removed when the resolver cache leaves sled (ADR-019 Increment 3)." },
    { id = "RUSTSEC-2024-0384", reason = "Audited 2026-11-23: instant 0.1.13 unmaintained pulled only by parking_lot 0.11.2 (sled 0.34.7) in crates/resolver; removed with sled (ADR-019 Increment 3)." },
    { id = "RUSTSEC-2025-0119", reason = "Audited 2026-11-22: number_prefix 0.4.0 unmaintained pulled by indicatif 0.17.11 in chain-registry-cli." },
    { id = "RUSTSEC-2024-0436", reason = "Audited 2026-11-22: paste 1.0.15 unmaintained proc-macro pulled by alloy-primitives 0.8.26, ratatui, nalgebra." },
    { id = "RUSTSEC-2026-0441", reason = "Audited 2026-11-22: pin-utils 0.1.0 unmaintained pulled by hyper 1.8.1 (axum, reqwest, tonic)." },
    { id = "RUSTSEC-2024-0370", reason = "Audited 2026-11-22: proc-macro-error 1.0.4 unmaintained proc-macro pulled by utoipa-gen 4.3.1 and alloy-sol-macro 0.6.4." },
    { id = "RUSTSEC-2026-0173", reason = "Audited 2026-11-22: proc-macro-error2 2.0.1 unmaintained proc-macro pulled by alloy-sol-macro 0.8.26." },
]

[bans]
# The workspace pulls several duplicate versions through libp2p and alloy.
# Report them without failing.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# ECO-INV-10: dead or unmaintained stacks must not come back.
deny = [
    { crate = "ethers", reason = "ADR-019 Increment 6: dead dependency; L1 code uses alloy via common::l1_rpc." },
    { crate = "ethers-core", reason = "ADR-019 Increment 6: see ethers." },
    { crate = "ethers-providers", reason = "ADR-019 Increment 6: see ethers." },
    # sled is unmaintained (ECA-33). Only the resolver cache still uses it,
    # until ADR-019 Increment 3 replaces it with a bounded JSON cache.
    { crate = "sled", wrappers = ["resolver"], reason = "ADR-019: unmaintained; relayer and db-sync moved off it." },
]

[sources]
# Only crates.io, and no git dependencies (none exist today).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
