[bans]
# The workspace pulls several duplicate versions through libp2p, alloy and
# arkworks. Report them without failing.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
# Only crates.io, and no git dependencies (none exist today).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
