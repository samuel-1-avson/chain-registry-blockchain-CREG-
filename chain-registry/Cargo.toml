[workspace]
members = [
    "crates/common",
    "crates/cli",
    "crates/resolver",
    "crates/validator",
    "crates/consensus",
    "crates/node",
    "crates/ml-validator",
    "crates/wasm-sandbox",
    "crates/threshold-encryption",
    "crates/insurance",
    "crates/db-sync",
    "crates/ipfs-pinner",
    "crates/faucet",
    "crates/relayer",
    "crates/secrets",
    "crates/unpack",
    "crates/zone-ipc",
    "crates/gateway",
    "crates/l1-tx",
    "crates/registry-view",
]
# Retired by ADR-009 and unlinked from every built crate by ADR-019 Increment 6
# (ECA-33). Its source is kept for reference only; it is not built, tested or
# audited with the workspace. Deleting it is a maintainer decision.
exclude = ["crates/zk-validator", "tools/relayer-sled-export"]
resolver = "2"

[workspace.dependencies]
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
thiserror    = "1"
tracing      = "0.1"
sha2         = "0.10"
hex          = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand         = "0.8"
sled         = "0.34"
rocksdb      = { version = "0.22", default-features = false, features = ["snappy"] }
reqwest      = { version = "0.12", features = ["json", "multipart", "stream"] }
clap         = { version = "4", features = ["derive"] }
chrono       = { version = "0.4", features = ["serde"] }
uuid         = { version = "1", features = ["v4", "serde"] }
urlencoding  = "2"
futures      = "0.3"

# gRPC / Protobuf dependencies
tonic        = { version = "0.12", features = ["transport", "prost"] }
prost        = "0.13"
prost-types  = "0.13"

# ML dependencies
ort           = "2.0.0-rc.12"
tract-onnx    = "0.21"
tokenizers    = { version = "0.15", default-features = false }

# WASM dependencies
wasmtime      = { version = "48.0.10", default-features = false, features = ["cranelift", "runtime"] }

# Ethereum/EVM dependencies
alloy         = { version = "0.6", features = ["full", "json-rpc"] }
alloy-sol-types = "0.6"

# PostgreSQL for the L1 services (relayer, faucet, l1-tx nonce ledger).
# TLS uses rustls + webpki roots; plaintext is refused by policy except for
# loopback, UNIX sockets, or an explicit private-network opt-in (ECA-32).
sqlx          = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "tls-rustls-ring-webpki"] }
async-trait   = "0.1"
zeroize       = "=1.8.2"

# Web/HTTP dependencies
axum          = "0.7"
tower         = "0.4"
tower-http    = { version = "0.5", features = ["cors", "fs"] }
tracing-subscriber = "0.3"

# ── Workspace lint policy ────────────────────────────────────────────────────
# Zero blanket rustc or clippy lint allows (ADR-018 Increment 7 / VNA-29).
[workspace.lints.rust]

[workspace.lints.clippy]

# Keep local target/ small on Windows. Full debug + unpacked PDBs previously
# grew this workspace past 100 GB (incremental + per-crate .pdb files).
[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "off"
incremental = true

[profile.dev.package."*"]
opt-level = 0
debug = false

