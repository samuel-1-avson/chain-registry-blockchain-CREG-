[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "creg-pypi-authority-verifier"
version = "1.0.0"
description = "Offline, policy-pinned PyPI PEP 740 authority verifier for CREG"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pypi-attestations==0.0.30",
  "rfc8785==0.1.4",
  "sigstore==4.5.0",
  "sigstore-models==0.0.6",
]

[project.scripts]
creg-pypi-authority-verifier = "creg_pypi_verifier.sidecar:main"

[dependency-groups]
build = [
  "pyinstaller==6.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/creg_pypi_verifier"]

[tool.uv]
package = true
