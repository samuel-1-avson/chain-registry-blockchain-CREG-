name: Release CREG binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            archive: tar.gz
          - os: macos-13
            platform: macos-amd64
            archive: tar.gz
          - os: windows-latest
            platform: windows-amd64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          [[ "$tag" == v* ]] || { echo "release tag must start with v" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        shell: bash
        env:
          CREG_RELEASE_VERSION: ${{ steps.release.outputs.tag }}
        run: cargo build --locked --release --package chain-registry-cli --package chain-registry-node

      - name: Verify embedded release versions (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          expected="${TAG#v}"
          test "$(target/release/creg --version)" = "creg ${expected}"
          test "$(target/release/creg-node --version)" = "creg-node ${expected}"

      - name: Verify embedded release versions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $expected = $env:TAG.TrimStart('v')
          if ((& target/release/creg.exe --version) -ne "creg $expected") { throw "creg version does not match $env:TAG" }
          if ((& target/release/creg-node.exe --version) -ne "creg-node $expected") { throw "creg-node version does not match $env:TAG" }

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "package/chain-registry-${TAG}-${PLATFORM}"
          cp target/release/creg target/release/creg-node "package/chain-registry-${TAG}-${PLATFORM}/"
          tar -czf "chain-registry-${TAG}-${PLATFORM}.tar.gz" -C package "chain-registry-${TAG}-${PLATFORM}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $dir = "package/chain-registry-$env:TAG-$env:PLATFORM"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/creg.exe,target/release/creg-node.exe $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "chain-registry-$env:TAG-$env:PLATFORM.zip"

      - name: Upload packaged archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: chain-registry-${{ steps.release.outputs.tag }}-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish release and checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd release-assets
          sha256sum chain-registry-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
