# explorer/nginx-main.conf — replaces /etc/nginx/nginx.conf in the explorer
# image (ADR-019 Increment 1, ECA-38). Identical to the stock nginx:alpine
# main config except that it loads the bundled njs module, which the /rpc
# JSON-RPC method allowlist (rpc-allowlist.js) needs. Server blocks still come
# from /etc/nginx/conf.d/ (rendered from nginx.conf by the image's envsubst).
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
