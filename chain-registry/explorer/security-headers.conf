# explorer/security-headers.conf — ADR-019 Increment 1 (ECA-35).
#
# nginx inherits `add_header` from the enclosing level ONLY when the current
# level defines none. Any location that sets its own header (Cache-Control,
# for example) therefore silently dropped the server-level security headers,
# including on the SPA document served through `location = /index.html`.
# This file is `include`d in EVERY location instead of being set once at
# server level. Installed at /etc/nginx/snippets/ by the Dockerfile.
#
# CSP notes:
# - script-src 'self': the bundle and registerSW.js are same-origin files;
#   there is no inline script. object-src/base-uri/frame-ancestors close the
#   plugin, <base> and clickjacking vectors.
# - style-src keeps 'unsafe-inline' because the WalletConnect modal injects
#   style elements; Google Fonts CSS is allowed until fonts are self-hosted.
# - connect-src allows https:/wss: for wallet RPC and WalletConnect relays.
#   Trusted Types and a narrower connect-src are ADR-019 Increment 7.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; require-trusted-types-for 'script'; trusted-types creg-default" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
