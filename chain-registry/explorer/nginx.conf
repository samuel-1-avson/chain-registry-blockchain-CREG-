# Rendered to /etc/nginx/conf.d/default.conf by the image's envsubst step
# (only ${CREG_*} variables are substituted; see Dockerfile).
#
# ADR-019 Increment 1:
# - ECA-35: security headers come from one snippet that is `include`d in every
#   location. nginx drops inherited `add_header`s in any location that sets
#   its own, which previously stripped them from the SPA document.
# - ECA-29: the client address is recovered with the realip module, trusting
#   X-Forwarded-For only from private-network peers (the edge Caddy / load
#   balancer on the Docker network) and walking it from the right. A public
#   peer keeps its own address, so a spoofed header changes nothing. The
#   recovered address feeds `limit_req`, `X-Real-IP`, and the appended
#   X-Forwarded-For that the node parses right-most-untrusted first (VNA-08).
# - ECA-38: /rpc is POST-only, body-capped, rate-limited and restricted to a
#   JSON-RPC method allowlist (rpc-allowlist.js).

js_import rpc from /etc/nginx/njs/rpc-allowlist.js;
limit_req_zone $binary_remote_addr zone=creg_rpc:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location = /chain-spec.json {
        include /etc/nginx/snippets/security-headers.conf;
        set $spec_upstream http://spec-server;
        proxy_pass $spec_upstream/chain-spec.json;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /chain-spec.json.sig {
        include /etc/nginx/snippets/security-headers.conf;
        set $spec_upstream http://spec-server;
        proxy_pass $spec_upstream/chain-spec.json.sig;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location ^~ /phase-c/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $spec_upstream http://spec-server;
        proxy_pass $spec_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location ^~ /api-docs {
        include /etc/nginx/snippets/security-headers-docs.conf;
        set $node_upstream http://${CREG_NODE_UPSTREAM};
        proxy_pass $node_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Keep grouped routes intact: their public/operator access boundaries are
    # enforced by the node. The browser client owns legacy fallback handling.
    location = /v1/public/events {
        include /etc/nginx/snippets/security-headers.conf;
        set $node_upstream http://${CREG_NODE_UPSTREAM};
        proxy_pass $node_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location = /v1/public/v4/events {
        include /etc/nginx/snippets/security-headers.conf;
        set $node_upstream http://${CREG_NODE_UPSTREAM};
        proxy_pass $node_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location = /v1/index/events {
        include /etc/nginx/snippets/security-headers.conf;
        set $indexer_upstream http://${CREG_INDEXER_UPSTREAM};
        proxy_pass $indexer_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /v1/index/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $indexer_upstream http://${CREG_INDEXER_UPSTREAM};
        proxy_pass $indexer_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }

    location ~ "^/v1/public/blocks/([A-Fa-f0-9]{64})$" {
        include /etc/nginx/snippets/security-headers.conf;
        set $node_upstream http://${CREG_NODE_UPSTREAM};
        proxy_pass $node_upstream/v1/public/blocks/hash/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location ~ "^/v1/blocks/([A-Fa-f0-9]{64})$" {
        include /etc/nginx/snippets/security-headers.conf;
        set $node_upstream http://${CREG_NODE_UPSTREAM};
        proxy_pass $node_upstream/v1/blocks/hash/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # API proxy to node service
    # CREG_NODE_UPSTREAM is rendered at container startup by nginx envsubst.
    location /v1/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $node_upstream http://${CREG_NODE_UPSTREAM};
        proxy_pass $node_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The public-services stack does not currently run a relayer. Route this
    # path to the real node so it returns its actual unavailable/404 response
    # instead of a 502 from an unregistered Docker DNS name.
    location /v1/relayer/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $node_upstream http://${CREG_NODE_UPSTREAM};
        proxy_pass $node_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    # SSE events proxy
    location /v1/events {
        include /etc/nginx/snippets/security-headers.conf;
        set $node_upstream http://${CREG_NODE_UPSTREAM};
        proxy_pass $node_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # JSON-RPC proxy for browser wallet actions and `creg testnet stake-*`.
    # ECA-38: POST-only, 64 KiB body cap (kept in memory so njs can read it),
    # 10 req/s per client with a burst of 20, method allowlist enforced by
    # rpc.proxy before anything reaches the upstream.
    location = /rpc {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=creg_rpc burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        js_content rpc.proxy;
    }

    # The configured URL includes the actual Sepolia gateway URI. A variable
    # proxy URL with no URI would forward the local "/rpc" to the provider.
    location = /_rpc_upstream {
        internal;
        set $rpc_upstream ${CREG_SEPOLIA_RPC_UPSTREAM};
        proxy_pass $rpc_upstream;
        proxy_set_header Host ${CREG_SEPOLIA_RPC_HOST};
        proxy_set_header Content-Type application/json;
        proxy_ssl_server_name on;
        proxy_ssl_name ${CREG_SEPOLIA_RPC_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        subrequest_output_buffer_size 1m;
    }

    # Faucet proxy — passes /api/* through to the faucet (routes are already under /api)
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $faucet_upstream http://faucet:8082;
        proxy_pass $faucet_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /registerSW.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA fallback (internal redirect to /index.html, which sets the headers)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location = /health {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        return 200 "ok";
    }

    # No-op favicon to silence 404 log noise
    location = /favicon.ico {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        log_not_found off;
        return 204;
    }
}
