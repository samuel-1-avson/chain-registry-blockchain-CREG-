# hub-web/security-headers.conf — ADR-019 Increment 1 (ECA-35).
#
# `include`d in every location of hub-web/nginx.conf: nginx drops inherited
# `add_header`s in any location that sets its own, so a server-level block is
# not enough. Installed at /etc/nginx/snippets/ by hub-web/Dockerfile.
#
# script-src 'self': Vite emits only same-origin module scripts. style-src
# keeps 'unsafe-inline' for runtime-injected wallet styles and allows the
# Google Fonts stylesheet until fonts are self-hosted. connect-src allows
# https:/wss: for the browser wallet's RPC. Trusted Types is Increment 7.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
