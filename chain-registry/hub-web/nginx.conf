server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker DNS; variable proxy_pass avoids startup failure when hub-api is scaled to 0 (edge + Cloud Run).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ADR-019 Increment 1:
    # - ECA-35: security headers are included in every location (see
    #   security-headers.conf for why a server-level block is not enough).
    # - ECA-29/ECA-36: the client address is recovered with the realip module,
    #   trusting X-Forwarded-For only from private-network peers (the edge
    #   Caddy on the Docker network) and walking it from the right. A public
    #   peer keeps its own address. hub-api keys its rate limiter on the
    #   resulting X-Real-IP, which a client cannot set.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $hub_api_upstream hub-api:8095;
        proxy_pass http://$hub_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
