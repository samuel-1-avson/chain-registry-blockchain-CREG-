[package]
name = "zone-ipc"
version = "0.1.0"
edition = "2021"
description = "Authenticated inter-zone IPC transport for CREG four-zone validator split (ADR-018)"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
hmac = "0.12"
hkdf = "0.12"
hex = { workspace = true }
subtle = "=2.6.1"
zeroize = "=1.8.2"
tracing = { workspace = true }
rand = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
