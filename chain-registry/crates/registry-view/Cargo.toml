[package]
name = "registry-view"
version = "0.1.0"
edition = "2021"
description = "Versioned public read contract for CREG v4 package status, proofs, witnesses and events (ADR-019 §3.3)"

[features]
# OpenAPI schemas for the node's `/v1/openapi.json` (ADR-019 §3.3: this crate
# is the single source for the v4 schemas).
openapi = ["dep:utoipa"]

[dependencies]
common     = { path = "../common" }
serde      = { workspace = true }
serde_json = { workspace = true }
utoipa     = { version = "4", optional = true }

[lints]
workspace = true
