[package]
name    = "chain-registry-node"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "node"
path = "src/lib.rs"

[[bin]]
name = "creg-node"
path = "src/main.rs"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump_openapi.rs"

[[bin]]
name = "creg-indexer"
path = "src/bin/creg_indexer.rs"

[[bin]]
name = "creg-consensusd"
path = "src/bin/creg_consensusd.rs"

[[bin]]
name = "creg-node-supervisor"
path = "src/bin/creg_node_supervisor.rs"


# Test-only sidecar used to prove the cleared-environment private-temp launch
# contract. It is not a production namespace-authority verifier.
[[bin]]
name = "creg-authority-rejection-fixture"
path = "src/bin/creg_authority_rejection_fixture.rs"

[dependencies]
common    = { path = "../common", features = ["l1-rpc"] }
chain-registry-secrets = { path = "../secrets" }
validator = { path = "../validator" }
ml-validator = { path = "../ml-validator" }
consensus = { path = "../consensus" }
resolver  = { path = "../resolver" }
registry-view = { path = "../registry-view", features = ["openapi"] }
db-sync   = { path = "../db-sync" }
threshold-encryption = { path = "../threshold-encryption" }
zone-ipc  = { path = "../zone-ipc" }

tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
anyhow       = { workspace = true }
subtle       = "=2.6.1"
zeroize      = "=1.8.2"
tracing      = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono       = { workspace = true }
uuid         = { workspace = true }
sha2         = { workspace = true }
hex          = { workspace = true }
reqwest      = { workspace = true }
rocksdb      = { workspace = true }
arc-swap     = "=1.9.1"
ed25519-dalek = { workspace = true }
rand         = { workspace = true }

axum         = { version = "0.7", features = ["json", "ws"] }
axum-server  = { version = "0.7", features = ["tls-rustls"], optional = true }
tower        = { version = "0.4" }
tower-http   = { version = "0.5", features = ["cors", "trace", "limit"] }
tokio-stream = { version = "0.1", features = ["sync"] }
flate2       = "1"
tar          = "0.4"
libc         = "0.2"
urlencoding  = { workspace = true }
thiserror    = { workspace = true }
futures      = { workspace = true }
aes-gcm      = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
libp2p       = { version = "0.56", features = ["tcp", "dns", "websocket", "noise", "yamux", "kad", "gossipsub", "identify", "macros", "tokio"] }
alloy        = { workspace = true }
k256        = { version = "0.13", features = ["ecdsa"] }
tonic        = { workspace = true, features = ["transport"] }
prost        = { workspace = true }
rust-embed   = { version = "8.0", optional = true }
mime_guess   = { version = "2.0", optional = true }
semver       = "1"
tempfile      = "3"

# OpenAPI schema + Swagger UI.
# utoipa 4 is compatible with axum 0.7; utoipa-swagger-ui 7 exposes the
# `axum` feature that lets us mount Swagger directly onto our Router.
utoipa             = { version = "4", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui  = { version = "7", features = ["axum"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
default = []
embedded-explorer = ["dep:rust-embed", "dep:mime_guess"]
tls = ["axum-server"]
phase-c-real-fleet = ["common/phase-c-canonical-transactions", "ml-validator/phase-c-real-fleet"]

[[test]]
name = "multi_node_testnet_simulation"
path = "tests/multi_node_testnet_simulation.rs"

[[test]]
name = "high_throughput_stress_test"
path = "tests/high_throughput_stress_test.rs"

[lints]
workspace = true
