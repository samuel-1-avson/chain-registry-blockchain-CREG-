[package]
name = "chain-registry-relayer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "creg-relayer"
path = "src/main.rs"

[dependencies]
common = { path = "../common", features = ["l1-rpc"] }
chain-registry-secrets = { path = "../secrets" }
# Single-writer hot-wallet signer + durable EOA nonce ledger (ADR-019 Inc 6).
l1-tx = { path = "../l1-tx" }
tokio = { workspace = true }
axum = { workspace = true, features = ["json"] }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono = { workspace = true }
uuid = { workspace = true }
alloy = { workspace = true }
hex = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa"] }
# Durable relayer state (ADR-019 decision #5); replaces sled.
sqlx = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
