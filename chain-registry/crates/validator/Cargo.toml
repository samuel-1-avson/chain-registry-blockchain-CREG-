[package]
name    = "validator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "creg-sandboxd"
path = "src/bin/creg_sandboxd.rs"

[[bin]]
name = "creg-agent-runner"
path = "src/bin/creg_agent_runner.rs"

[dependencies]
common     = { path = "../common" }
chain-registry-secrets = { path = "../secrets" }
zone-ipc   = { path = "../zone-ipc" }
ai-config  = { path = "../ai-config" }
tokio      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono     = { workspace = true }
hex        = { workspace = true }
sha2       = { workspace = true }
reqwest      = { workspace = true }
uuid         = { version = "1.0", features = ["v4"] }
static_assertions = "1.1"
creg-unpack = { path = "../unpack" }
bytes      = "1.12"
toml       = "=0.8.23"
strsim     = "0.11"
once_cell  = "1"
pgp        = "0.14"
tempfile   = "3"
ml-validator = { path = "../ml-validator" }
base64       = "0.22"
ed25519-dalek = { workspace = true }
wasm_sandbox_crate = { package = "wasm-sandbox", path = "../wasm-sandbox" }

[lints]
workspace = true

[dev-dependencies]
flate2 = "1"
tar = "0.4"
wat = "1.201"
