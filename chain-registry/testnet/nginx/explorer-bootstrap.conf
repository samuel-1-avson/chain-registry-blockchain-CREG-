# Explorer static UI during public-service bootstrap.
# Chain API reads intentionally return 503 until an observer pool is attached.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /v1/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"observer_unavailable","message":"The validator observer pool is not attached yet."}';
    }

    location = /rpc {
        if ($request_method != POST) {
            return 200 '{"service":"CREG Sepolia L1 JSON-RPC","chainId":"0xaa36a7","usage":"POST JSON-RPC 2.0 eth_* methods to this URL"}';
        }
        proxy_pass https://ethereum-sepolia-rpc.publicnode.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host ethereum-sepolia-rpc.publicnode.com;
        proxy_http_version 1.1;
    }

    location /api/ {
        set $faucet_upstream http://faucet:8082;
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_pass $faucet_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok";
    }
}
