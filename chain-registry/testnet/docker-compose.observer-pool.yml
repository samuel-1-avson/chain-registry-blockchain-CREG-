# Observer read pool — one observer per VM (GCP MIG scales VMs, not containers).
#
# Peers with independently operated validators; serves public read API on host port 28182.
#
# Prerequisites in sepolia-fleet.env (or exported before compose):
#   CREG_ETH_RPC, CREG_EDGE_INTERNAL_IP
#   CREG_VALIDATOR_P2P_SEEDS — comma-separated external bootnode/validator P2P seeds
#   CREG_VALIDATOR_HTTP_PEERS — comma-separated external validator HTTP peers
#
# Usage (on observer-pool VM):
#   ./testnet/start-observer-pool-gcp.sh

x-observer-pool-common: &observer-pool-common
  image: ${CREG_FLEET_IMAGE:-ghcr.io/chain-registry/chain-registry:latest}
  # Only used when CREG_OBSERVER_BUILD/CREG_FLEET_BUILD is explicitly set.
  # Keeping the build on the observer profile avoids parsing the legacy
  # validator-fleet compose file (which contains validator-key fields).
  build:
    context: ..
    dockerfile: Dockerfile.windows
  env_file:
    - sepolia-fleet.env
  networks:
    - creg-observer-pool
  restart: unless-stopped

services:
  observer:
    <<: *observer-pool-common
    container_name: creg-observer-pool
    environment:
      CREG_CHAIN_ID: creg-testnet-1
      CREG_EXPECTED_L1_CHAIN_ID: "11155111"
      CREG_LISTEN: 0.0.0.0:8080
      CREG_DATA_DIR: /data
      CREG_BLOCK_INTERVAL: "5"
      CREG_IPFS_URL: ${CREG_IPFS_URL:?set CREG_IPFS_URL}
      CREG_CHAIN_SPEC_URL: ${CREG_CHAIN_SPEC_URL:?set CREG_CHAIN_SPEC_URL}
      CREG_CHAIN_SPEC_OFFLINE: "false"
      CREG_P2P_LISTEN: /ip4/0.0.0.0/tcp/9000
      CREG_SPEC_SIGNING_PUBKEY: "3fe87833177b04b0a18600eace041692a35fb2b85f6e14e6734d894a0fd61c01"
      CREG_WEAK_SUBJECTIVITY_CHECKPOINT: ${CREG_WEAK_SUBJECTIVITY_CHECKPOINT:-}
      CREG_REQUIRE_CERTIFIED_COMMITTEES: ${CREG_REQUIRE_CERTIFIED_COMMITTEES:-false}
      CREG_REGISTRY_ADDR: ${CREG_REGISTRY_ADDR:-0xF232cC6F5C6EfC74C7517B209D15baBd57b817eE}
      CREG_STAKING_ADDR: ${CREG_STAKING_ADDR:-0xE906ae140987CC2cA711dDa4ee43574d3aDc31b7}
      CREG_GOVERNANCE_ADDR: ${CREG_GOVERNANCE_ADDR:-0x622161F4Ae52F80235dd683FCD769c9d5335F581}
      CREG_TOKEN_ADDR: ${CREG_TOKEN_ADDR:-0xB326dB1C6e457f4AdfBb11f17FDc145ED585b288}
      CREG_ZK_VERIFIER_ADDR: ${CREG_ZK_VERIFIER_ADDR:-0x893655093042D584BA14682E307971C705425644}
      CREG_TESTNET: "true"
      CREG_IS_VALIDATOR: "false"
      CREG_OPERATOR_API_KEY: ${CREG_OPERATOR_API_KEY:?set a high-entropy server-side operator API key}
      CREG_NAMESPACE_AUTHORITY_ARCHIVE_MAX_BYTES: ${CREG_NAMESPACE_AUTHORITY_ARCHIVE_MAX_BYTES:-10737418240}
      CREG_NAMESPACE_AUTHORITY_ARCHIVE_MAX_ENTRIES: ${CREG_NAMESPACE_AUTHORITY_ARCHIVE_MAX_ENTRIES:-100000}
      CREG_NAMESPACE_AUTHORITY_ARCHIVE_MIN_RETENTION_SECS: ${CREG_NAMESPACE_AUTHORITY_ARCHIVE_MIN_RETENTION_SECS:-31536000}
      CREG_NODE_ID: ${CREG_OBSERVER_NODE_ID:-observer-pool-1}
      CREG_P2P_SEEDS: ${CREG_VALIDATOR_P2P_SEEDS:?set CREG_VALIDATOR_P2P_SEEDS}
      CREG_PEERS: ${CREG_VALIDATOR_HTTP_PEERS:?set CREG_VALIDATOR_HTTP_PEERS}
      RUST_LOG: info,chain_registry_node=debug
    ports:
      - "${CREG_OBSERVER_POOL_API_PORT:-28182}:8080"
      - "${CREG_OBSERVER_POOL_P2P_PORT:-29102}:9000"
    volumes:
      - observer-pool-data:/data
      - ./chain-spec-cache:/cache:ro

networks:
  creg-observer-pool:
    driver: bridge

volumes:
  observer-pool-data:
