substitutions:
  _IMAGE: ""
  _SOURCE_REVISION: ""
  _SOURCE_MANIFEST_SHA256: ""
  _SOURCE_DATE_EPOCH: ""

steps:
  - id: build-committed-r7-node-and-cli
    name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --file
      - Dockerfile.committed-source
      - --target
      - node-cli
      - --build-arg
      - SOURCE_REVISION=${_SOURCE_REVISION}
      - --build-arg
      - SOURCE_MANIFEST_SHA256=${_SOURCE_MANIFEST_SHA256}
      - --build-arg
      - SOURCE_DATE_EPOCH=${_SOURCE_DATE_EPOCH}
      - --build-arg
      - CARGO_TARGET_CACHE_ID=creg-phase-c-rust193-${_SOURCE_MANIFEST_SHA256}
      - --tag
      - ${_IMAGE}
      - .

  - id: verify-node-version
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - ${_IMAGE}
      - --version

  - id: verify-cli-version
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint=/app/creg
      - ${_IMAGE}
      - --version

  - id: record-node-cli-binary-hashes
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint=/usr/bin/sha256sum
      - ${_IMAGE}
      - /app/creg-node
      - /app/creg

images:
  - ${_IMAGE}

timeout: 7200s
options:
  diskSizeGb: "100"
  logging: CLOUD_LOGGING_ONLY
