name: creg-public-explorer
services:
  explorer:
    image: us-central1-docker.pkg.dev/gen-lang-client-0022105784/creg-testnet/creg-web-explorer@sha256:ae0d80a7bd6f5534d4814dffdf613b66c4fee31843bfec69f713ce4319fbe122
    container_name: creg-explorer-public-r25
    restart: unless-stopped
    ports:
      - "127.0.0.1:3026:80"
    environment:
      CREG_NODE_UPSTREAM: ${CREG_PUBLIC_EXPLORER_NODE_UPSTREAM:-creg-node:8080}
      CREG_SEPOLIA_RPC_UPSTREAM: https://api.testnet.cregnet.dev/sepolia
      CREG_SEPOLIA_RPC_HOST: api.testnet.cregnet.dev
    networks:
      public-services:
        aliases: [web-explorer]
networks:
  public-services:
    external: true
    name: testnet_creg-unified-net
